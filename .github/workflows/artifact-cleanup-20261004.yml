name: Archive verified historical CI files and remove obsolete copies
on:
  push:
    branches:
      - maintenance/artifact-cleanup-20261004
    paths:
      - .github/workflows/artifact-cleanup-20261004.yml
      - .github/maintenance/archive-ci-artifacts-20261004.py
      - .github/maintenance/archive-ci-artifacts-20261004.json
      - .github/maintenance/verify-archive-ci-artifacts-20261004.py
permissions:
  actions: write
  contents: write
  pull-requests: read
concurrency:
  group: fixed-artifact-cleanup-20261004
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/maintenance/artifact-cleanup-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_CLEANUP_TOKEN: ${{ github.token }}
      ARTIFACT_CLEANUP_CONFIG: ${{ github.workspace }}/.github/maintenance/archive-ci-artifacts-20261004.json
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed backup and deletion safeguards
        run: python .github/maintenance/verify-archive-ci-artifacts-20261004.py
      - name: Archive verified test files and remove only selected Actions copies
        run: python .github/maintenance/archive-ci-artifacts-20261004.py
      - name: Check live artifact upload availability
        id: quota_probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: artifact-cleanup-quota-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-cleanup-quota-probe.txt
          if-no-files-found: error
          retention-days: 1
      - name: Verify unchanged heads and remove only this temporary probe
        env:
          ARTIFACT_QUOTA_PROBE_OUTCOME: ${{ steps.quota_probe.outcome }}
          ARTIFACT_QUOTA_PROBE_ID: ${{ steps.quota_probe.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          config = json.loads(Path(os.environ['ARTIFACT_CLEANUP_CONFIG']).read_text())
          spec = importlib.util.spec_from_file_location('archive_worker', '.github/maintenance/archive-ci-artifacts-20261004.py')
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)
          client = worker.Api(config)
          worker.check_heads(client, config)
          outcome = os.environ['ARTIFACT_QUOTA_PROBE_OUTCOME']
          artifact_id = os.environ.get('ARTIFACT_QUOTA_PROBE_ID', '')
          if outcome == 'success':
              if not artifact_id.isdigit():
                  raise RuntimeError('Probe artifact ID missing')
              artifact = client('/actions/artifacts/' + artifact_id)
              expected = 'artifact-cleanup-quota-probe-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              if (artifact is None or artifact['name'] != expected or
                      artifact['workflow_run']['id'] != int(os.environ['GITHUB_RUN_ID']) or
                      artifact['workflow_run']['repository_id'] != config['repository_id'] or
                      artifact['size_in_bytes'] > 10000):
                  raise RuntimeError('Probe does not belong to this maintenance run')
              client('/actions/artifacts/' + artifact_id, method='DELETE')
              if client('/actions/artifacts/' + artifact_id) is not None:
                  raise RuntimeError('Temporary probe still exists')
          elif outcome != 'failure':
              raise RuntimeError('Unexpected quota probe outcome')
          print('ARTIFACT_QUOTA_PROBE_RESULT=' + json.dumps({'outcome': outcome, 'temporary_probe_removed': outcome == 'success'}), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n## Artifact storage probe\n\nResult: ' + outcome + '. This is not the PR 45 CI result.\n')
          PY
