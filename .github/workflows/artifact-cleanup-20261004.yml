name: Remove 24 obsolete documentation build artifacts

"on":
  push:
    branches:
      - maintenance/artifact-cleanup-20261004
    paths:
      - .github/workflows/artifact-cleanup-20261004.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: artifact-cleanup-20261004
  cancel-in-progress: false

jobs:
  fixed-artifact-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_CLEANUP_TOKEN: ${{ github.token }}
    steps:
      - name: Validate fixed manifest and remove obsolete artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fixed-artifact-cleanup.py" <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request
          
          CONFIG = json.loads(r'''{"repository":"Perrystack9/Fahrerabrechnung_Android_0.4.1","repository_id":1382233234,"branch":"maintenance/artifact-cleanup-20261004","main":"4b2c0b875d1912a91013bb23f0dbfe1596d0b3a2","pr":45,"pr_head":"42fb5dea0fb8f18d1b2206bda5d09b59b4ebe8b1","selected":[{"id":11266987481,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18442865,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11266817918,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":25181239,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11266653228,"name":"Fahrerabrechnung-Android-0.4.1-project","size":909520,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11240501168,"name":"Fahrerabrechnung-Android-0.4.1-project","size":886919,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11240456230,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":25150915,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11240361273,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18423969,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11227235716,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":25122634,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11226538894,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18403555,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11226214444,"name":"Fahrerabrechnung-Android-0.4.1-project","size":865507,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11224450396,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":25122386,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11224208511,"name":"Fahrerabrechnung-Android-0.4.1-project","size":861016,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11223384326,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18403275,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11214165244,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":25007190,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11214090523,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18323319,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11214075700,"name":"Fahrerabrechnung-Android-0.4.1-project","size":808911,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11167856183,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18276556,"run":36872176443,"branch":"docs/automatic-card-import-ui","head":"37a89a5f03f79700ab803cfae48eb85a8c5838c2"},{"id":11167621499,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":24936549,"run":36872176443,"branch":"docs/automatic-card-import-ui","head":"37a89a5f03f79700ab803cfae48eb85a8c5838c2"},{"id":11167477086,"name":"Fahrerabrechnung-Android-0.4.1-project","size":755938,"run":36872176443,"branch":"docs/automatic-card-import-ui","head":"37a89a5f03f79700ab803cfae48eb85a8c5838c2"},{"id":11156129306,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18276553,"run":36852926669,"branch":"docs/pr28-device-handoff","head":"672418dda09acfaab50cbc63939d66c769688f2e"},{"id":11156109335,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":24936550,"run":36852926669,"branch":"docs/pr28-device-handoff","head":"672418dda09acfaab50cbc63939d66c769688f2e"},{"id":11156094402,"name":"Fahrerabrechnung-Android-0.4.1-project","size":755182,"run":36852926669,"branch":"docs/pr28-device-handoff","head":"672418dda09acfaab50cbc63939d66c769688f2e"},{"id":11150870196,"name":"Fahrerabrechnung-0.4.1-internal-apk","size":18277784,"run":36838890180,"branch":"docs/work-handoff-2026-10-01","head":"9a89154b1d1250bb47ac006b208f782453f38800"},{"id":11150675460,"name":"Fahrerabrechnung-Android-0.4.1-project","size":750729,"run":36838890180,"branch":"docs/work-handoff-2026-10-01","head":"9a89154b1d1250bb47ac006b208f782453f38800"},{"id":11150660547,"name":"Fahrerabrechnung-0.4.1-debug-apk","size":24936468,"run":36838890180,"branch":"docs/work-handoff-2026-10-01","head":"9a89154b1d1250bb47ac006b208f782453f38800"}],"protected":[{"id":11266699620,"name":"android-0.4.1-instrumentation-results","size":6301308,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11266453542,"name":"FahrerTagebuch-device-test-update","size":50333809,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11266063320,"name":"android-0.4.1-build-logs","size":263877,"run":37102174245,"branch":"docs/pr41-device-handoff","head":"340d77173a467e7f3f286b451539db033ab836b6"},{"id":11241272546,"name":"android-0.4.1-instrumentation-results","size":6507898,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11240681067,"name":"FahrerTagebuch-device-test-update","size":50275143,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11240421170,"name":"android-0.4.1-build-logs","size":258241,"run":37035426852,"branch":"docs/pr39-device-handoff","head":"980374f389bd71aa5e37b232bdf8d4bc04781877"},{"id":11227536459,"name":"android-0.4.1-instrumentation-results","size":6419192,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11227210808,"name":"android-0.4.1-build-logs","size":252774,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11226329291,"name":"FahrerTagebuch-device-test-update","size":50246717,"run":37007732611,"branch":"docs/pr37-device-handoff","head":"b2cf4669a969b2c04491e25b5671cb4a353ac5a3"},{"id":11225540463,"name":"android-0.4.1-instrumentation-results","size":7131775,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11224153604,"name":"FahrerTagebuch-device-test-update","size":50145087,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11223374345,"name":"android-0.4.1-build-logs","size":250935,"run":37002267395,"branch":"docs/pr35-device-handoff","head":"b558ac0dd3bdba6056881015881269bc97dc9de9"},{"id":11214505807,"name":"android-0.4.1-instrumentation-results","size":7291884,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11213827210,"name":"android-0.4.1-build-logs","size":238787,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11213579225,"name":"FahrerTagebuch-device-test-update","size":49999997,"run":36976800056,"branch":"docs/pr32-device-test-result","head":"2a00b82e5a4b4859f3e101ddf3ecaa62272637d3"},{"id":11167373562,"name":"android-0.4.1-instrumentation-results","size":7057159,"run":36872176443,"branch":"docs/automatic-card-import-ui","head":"37a89a5f03f79700ab803cfae48eb85a8c5838c2"},{"id":11167342241,"name":"android-0.4.1-build-logs","size":220738,"run":36872176443,"branch":"docs/automatic-card-import-ui","head":"37a89a5f03f79700ab803cfae48eb85a8c5838c2"},{"id":11157251429,"name":"android-0.4.1-instrumentation-results","size":7176656,"run":36852926669,"branch":"docs/pr28-device-handoff","head":"672418dda09acfaab50cbc63939d66c769688f2e"},{"id":11156825357,"name":"android-0.4.1-build-logs","size":220740,"run":36852926669,"branch":"docs/pr28-device-handoff","head":"672418dda09acfaab50cbc63939d66c769688f2e"},{"id":11150861922,"name":"android-0.4.1-instrumentation-results","size":7085162,"run":36838890180,"branch":"docs/work-handoff-2026-10-01","head":"9a89154b1d1250bb47ac006b208f782453f38800"},{"id":11149719871,"name":"android-0.4.1-build-logs","size":219320,"run":36838890180,"branch":"docs/work-handoff-2026-10-01","head":"9a89154b1d1250bb47ac006b208f782453f38800"}],"run_ids":[37102174245,37035426852,37007732611,37002267395,36976800056,36872176443,36852926669,36838890180]}''')
          ALLOWED_NAMES = {
              "Fahrerabrechnung-0.4.1-debug-apk",
              "Fahrerabrechnung-0.4.1-internal-apk",
              "Fahrerabrechnung-Android-0.4.1-project",
          }
          
          def api(path, method="GET"):
              if os.environ["GITHUB_API_URL"] != "https://api.github.com":
                  raise RuntimeError("Unexpected API host")
              url = "https://api.github.com/repos/" + CONFIG["repository"] + path
              request = urllib.request.Request(url, method=method, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_CLEANUP_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if method == "DELETE":
                          if response.status != 204:
                              raise RuntimeError("DELETE did not return 204")
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if method == "GET" and error.code == 404:
                      return None
                  raise RuntimeError(f"API {method} {path}: HTTP {error.code}") from None
          
          def check_heads(call):
              main = call("/branches/main")
              pr = call("/pulls/" + str(CONFIG["pr"]))
              if main is None or main["commit"]["sha"] != CONFIG["main"]:
                  raise RuntimeError("main changed; stop")
              if (pr is None or pr["head"]["sha"] != CONFIG["pr_head"] or
                  pr["state"] != "open" or pr["merged"] or
                  pr["base"]["repo"]["id"] != CONFIG["repository_id"] or
                  pr["head"]["repo"]["id"] != CONFIG["repository_id"]):
                  raise RuntimeError("PR 45 changed; stop")
          
          def metadata(artifact):
              run = artifact["workflow_run"]
              if (run["repository_id"] != CONFIG["repository_id"] or
                  run["head_repository_id"] != CONFIG["repository_id"]):
                  raise RuntimeError("Wrong artifact repository")
              return {
                  "id": artifact["id"], "name": artifact["name"],
                  "size": artifact["size_in_bytes"], "run": run["id"],
                  "branch": run["head_branch"], "head": run["head_sha"],
              }
          
          def list_run(call, run_id):
              response = call(f"/actions/runs/{run_id}/artifacts?per_page=100")
              if response is None or response["total_count"] > 100:
                  raise RuntimeError("Artifact run unavailable or incomplete")
              return {a["id"]: a for a in response["artifacts"]}
          
          def run_cleanup(call=api):
              if os.environ["GITHUB_REPOSITORY"] != CONFIG["repository"]:
                  raise RuntimeError("Wrong repository")
              if os.environ["GITHUB_REF"] != "refs/heads/" + CONFIG["branch"]:
                  raise RuntimeError("Wrong maintenance branch")
              selected_ids = {a["id"] for a in CONFIG["selected"]}
              protected_ids = {a["id"] for a in CONFIG["protected"]}
              if (len(selected_ids) != 24 or len(CONFIG["selected"]) != 24 or
                  selected_ids & protected_ids or
                  any(a["name"] not in ALLOWED_NAMES for a in CONFIG["selected"]) or
                  any(not a["branch"].startswith("docs/") for a in CONFIG["selected"])):
                  raise RuntimeError("Invalid fixed deletion manifest")
              check_heads(call)
              snapshots = {run: list_run(call, run) for run in CONFIG["run_ids"]}
              pending, already_absent = [], []
              # Validate the entire manifest and protected set before any deletion.
              for expected in CONFIG["protected"]:
                  artifact = snapshots[expected["run"]].get(expected["id"])
                  if artifact is None or metadata(artifact) != expected:
                      raise RuntimeError("Protected artifact missing or changed")
              for expected in CONFIG["selected"]:
                  artifact = snapshots[expected["run"]].get(expected["id"])
                  if artifact is None:
                      already_absent.append(expected["id"])
                      continue
                  if metadata(artifact) != expected or artifact["expired"]:
                      raise RuntimeError("Selected artifact metadata changed")
                  pending.append(expected)
              check_heads(call)
              deleted = []
              for expected in pending:
                  call("/actions/artifacts/" + str(expected["id"]), method="DELETE")
                  deleted.append(expected)
                  print("DELETED", expected["id"], expected["name"], expected["size"], flush=True)
              after = {run: list_run(call, run) for run in CONFIG["run_ids"]}
              for expected in CONFIG["selected"]:
                  if expected["id"] in after[expected["run"]]:
                      raise RuntimeError("Selected artifact still present after deletion")
              for expected in CONFIG["protected"]:
                  artifact = after[expected["run"]].get(expected["id"])
                  if artifact is None or metadata(artifact) != expected:
                      raise RuntimeError("Protected artifact changed")
              check_heads(call)
              summary = {
                  "deleted_count": len(deleted), "deleted_bytes": sum(a["size"] for a in deleted),
                  "already_absent": already_absent, "protected_count": len(protected_ids),
                  "main": CONFIG["main"], "pr45_head": CONFIG["pr_head"],
              }
              print("ARTIFACT_CLEANUP_RESULT=" + json.dumps(summary, sort_keys=True), flush=True)
              inventory = collections.defaultdict(lambda: {"count": 0, "bytes": 0})
              total_count, total_bytes, page = 0, 0, 1
              while True:
                  response = call(f"/actions/artifacts?per_page=100&page={page}")
                  if response is None:
                      raise RuntimeError("Remaining inventory unavailable")
                  for artifact in response["artifacts"]:
                      if artifact["expired"]:
                          continue
                      group = inventory[artifact["name"]]
                      group["count"] += 1
                      group["bytes"] += artifact["size_in_bytes"]
                      total_count += 1
                      total_bytes += artifact["size_in_bytes"]
                  if len(response["artifacts"]) < 100:
                      break
                  page += 1
                  if page > 30:
                      raise RuntimeError("Unexpectedly large artifact inventory")
              print("ARTIFACT_REMAINING_INVENTORY=" + json.dumps({
                  "count": total_count, "bytes": total_bytes, "groups": dict(inventory)
              }, sort_keys=True), flush=True)
              text = "Removed " + str(summary["deleted_count"]) + " fixed obsolete doc-build artifacts (" + str(summary["deleted_bytes"]) + " bytes). Protected reports/device-test packages: " + str(summary["protected_count"]) + ". main and PR 45 unchanged."
              Path(os.environ["RUNNER_TEMP"], "artifact-cleanup-quota-probe.txt").write_text(text + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("## Fixed artifact cleanup\n\n" + text + "\n")
              return summary
          
          if __name__ == "__main__":
              run_cleanup()
          
          PY
          python3 "$RUNNER_TEMP/fixed-artifact-cleanup.py"

      - name: Probe artifact storage availability after cleanup
        id: artifact_quota_probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: artifact-cleanup-quota-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-cleanup-quota-probe.txt
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

      - name: Record quota result and remove only this run's temporary probe
        shell: bash
        env:
          ARTIFACT_QUOTA_PROBE_OUTCOME: ${{ steps.artifact_quota_probe.outcome }}
          ARTIFACT_QUOTA_PROBE_ID: ${{ steps.artifact_quota_probe.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          
          path = Path(os.environ["RUNNER_TEMP"], "fixed-artifact-cleanup.py")
          spec = importlib.util.spec_from_file_location("fixed_cleanup", path)
          cleanup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cleanup)
          cleanup.check_heads(cleanup.api)
          outcome = os.environ["ARTIFACT_QUOTA_PROBE_OUTCOME"]
          artifact_id = os.environ.get("ARTIFACT_QUOTA_PROBE_ID", "")
          if outcome == "success":
              if not artifact_id.isdigit():
                  raise RuntimeError("Probe artifact ID missing")
              artifact = cleanup.api("/actions/artifacts/" + artifact_id)
              expected_name = "artifact-cleanup-quota-probe-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
              if (artifact is None or artifact["name"] != expected_name or
                  artifact["workflow_run"]["id"] != int(os.environ["GITHUB_RUN_ID"]) or
                  artifact["workflow_run"]["repository_id"] != cleanup.CONFIG["repository_id"] or
                  artifact["size_in_bytes"] > 10000):
                  raise RuntimeError("Probe artifact identity does not match this maintenance run")
              cleanup.api("/actions/artifacts/" + artifact_id, method="DELETE")
              if cleanup.api("/actions/artifacts/" + artifact_id) is not None:
                  raise RuntimeError("Temporary probe still present")
          elif outcome != "failure":
              raise RuntimeError("Unexpected quota probe outcome")
          print("ARTIFACT_QUOTA_PROBE_RESULT=" + json.dumps({"outcome": outcome, "temporary_probe_removed": outcome == "success"}), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n## Artifact storage probe\n\nResult: " + outcome + ". This is not the PR 45 CI result.\n")
          
          PY
