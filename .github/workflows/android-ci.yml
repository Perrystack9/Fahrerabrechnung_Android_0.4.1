name: Android 0.4.1 CI Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, card-foundation]

permissions:
  contents: read

# Superseded PR commits cancel their own verification. Every main/dispatch run has
# a unique group so that neither a running nor a pending authoritative run is lost.
concurrency:
  group: android-0.4.1-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_VERSION: "9.6.1"
  GRADLE_DIST_SHA256: "9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
  GRADLE_WRAPPER_SHA256: "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  changes:
    name: Project boundaries and CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/classify_ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify project boundaries
        run: bash scripts/verify_project_boundary.sh

      - name: Verify CI routing and schema guard regressions
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check shell syntax
        run: bash -n scripts/build_device_test_update.sh scripts/run_instrumentation.sh scripts/verify_room_schemas.sh

  build-and-verify:
    name: Build, test, lint and APK verification
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up verified Android toolchain
        uses: ./.github/actions/android-toolchain

      - name: Verify 0.4.1 project boundary
        shell: bash
        run: ./scripts/verify_project_boundary.sh | tee ci-logs/project-boundary.log

      - name: Run all required Gradle verification commands
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          : > ci-logs/required-command-status.tsv

          run_required() {
            local name="$1"
            shift
            echo "::group::${name}"
            set +e
            "$@" 2>&1 | tee "ci-logs/${name}.log"
            local code=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$name" "$code" >> ci-logs/required-command-status.tsv
            echo "exit=${code}"
            echo "::endgroup::"
          }

          set -e
          run_required help ./gradlew help --stacktrace
          run_required build-dry-run ./gradlew build --dry-run --stacktrace
          run_required test ./gradlew test --stacktrace
          run_required lint ./gradlew lint --stacktrace
          run_required assembleDebug ./gradlew assembleDebug --stacktrace
          run_required assembleInternal ./gradlew assembleInternal --stacktrace
          run_required assembleDeviceTest ./gradlew :app:assembleDeviceTest --stacktrace

          echo "Required command results:"
          cat ci-logs/required-command-status.tsv

          failed=0
          while IFS=$'\t' read -r name code; do
            if [ "$code" -ne 0 ]; then
              echo "FAILED: $name (exit $code)" >&2
              failed=1
            fi
          done < ci-logs/required-command-status.tsv
          exit "$failed"

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          INTERNAL_APK=$(find app/build/outputs/apk/internal -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$DEBUG_APK"
          test -n "$INTERNAL_APK"
          printf 'debug=%s\ninternal=%s\n' "$DEBUG_APK" "$INTERNAL_APK" | tee ci-logs/apk-paths.txt
          sha256sum "$DEBUG_APK" "$INTERNAL_APK" | tee ci-logs/apk-sha256.txt

      - name: Build and verify installable device-test update pair
        shell: bash
        run: bash scripts/build_device_test_update.sh

      - name: Verify generated Room schema exports
        shell: bash
        run: bash scripts/verify_room_schemas.sh

      - name: Upload failed build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ci-logs/
            **/build/reports/
            data/schemas/

  instrumentation:
    name: Room SQLCipher and Compose instrumentation
    needs: [changes, build-and-verify]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reserve disk space for the emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          df -h / | tee ci-logs/disk-before-cleanup.log
          # Only unused toolchains on the disposable runner; keep the project and SDK.
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h / | tee ci-logs/disk-after-cleanup.log

      - name: Set up verified Android toolchain
        uses: ./.github/actions/android-toolchain

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run Room SQLCipher and Compose tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run_instrumentation.sh

      - name: Verify generated Room schema exports
        shell: bash
        run: bash scripts/verify_room_schemas.sh

      - name: Upload failed instrumentation diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ci-logs/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            data/build/reports/androidTests/
            data/build/outputs/androidTest-results/

  verification:
    name: Android verification
    needs: [changes, build-and-verify, instrumentation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the complete verification appropriate to this change
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          BUILD_RESULT: ${{ needs.build-and-verify.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$ANDROID_REQUIRED" = true ]; then
            test "$BUILD_RESULT" = success
            test "$INSTRUMENTATION_RESULT" = success
            echo 'Complete Android verification passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$ANDROID_REQUIRED" = false
            test "$BUILD_RESULT" = skipped
            test "$INSTRUMENTATION_RESULT" = skipped
            echo 'Documentation-only change: project boundaries and CI guards passed; Android verification intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
