name: Remove authorized obsolete CI artifacts 2026-10-08

on:
  push:
    branches:
      - maintenance/artifact-cleanup-20261004
    paths:
      - .github/workflows/artifact-cleanup-authorized-20261008.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: artifact-cleanup-authorized-20261008
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/maintenance/artifact-cleanup-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete only explicitly authorized artifact classes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN: 4b2c0b875d1912a91013bb23f0dbfe1596d0b3a2
          EXPECTED_PR45: 42fb5dea0fb8f18d1b2206bda5d09b59b4ebe8b1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from collections import Counter

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if method == "DELETE":
                          if response.status != 204:
                              raise RuntimeError(f"DELETE {path} returned {response.status}")
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"{method} {path} failed with HTTP {e.code}") from None

          main = request("/branches/main")
          pr = request("/pulls/45")
          if main["commit"]["sha"] != os.environ["EXPECTED_MAIN"]:
              raise RuntimeError("main changed; refusing cleanup")
          if (pr["head"]["sha"] != os.environ["EXPECTED_PR45"] or
                  pr["state"] != "open" or pr.get("merged", False)):
              raise RuntimeError("PR #45 changed; refusing cleanup")

          wanted = {
              "android-0.4.1-build-logs",
              "TempMail-v0.1-debug-apk",
              "TempMail-v0.2-debug-apk",
          }
          artifacts = []
          page = 1
          while True:
              data = request(f"/actions/artifacts?per_page=100&page={page}")
              batch = [a for a in data["artifacts"] if not a["expired"]]
              artifacts.extend(batch)
              if len(data["artifacts"]) < 100:
                  break
              page += 1
              if page > 20:
                  raise RuntimeError("unexpectedly large artifact inventory")

          selected = [a for a in artifacts if a["name"] in wanted]
          counts = Counter(a["name"] for a in selected)
          expected_counts = Counter({
              "android-0.4.1-build-logs": 151,
              "TempMail-v0.1-debug-apk": 1,
              "TempMail-v0.2-debug-apk": 1,
          })
          if counts != expected_counts:
              raise RuntimeError(f"artifact inventory changed; expected {dict(expected_counts)}, got {dict(counts)}")

          total_bytes = sum(a["size_in_bytes"] for a in selected)
          expected_bytes = 67164219
          if total_bytes != expected_bytes:
              raise RuntimeError(f"artifact byte total changed; expected {expected_bytes}, got {total_bytes}")

          for artifact in selected:
              request(f"/actions/artifacts/{artifact['id']}", method="DELETE")
              print("DELETED", artifact["id"], artifact["name"], artifact["size_in_bytes"], flush=True)

          # Verify the authorized classes are now gone.
          remaining = []
          page = 1
          while True:
              data = request(f"/actions/artifacts?per_page=100&page={page}")
              remaining.extend(a for a in data["artifacts"] if not a["expired"] and a["name"] in wanted)
              if len(data["artifacts"]) < 100:
                  break
              page += 1
          if remaining:
              raise RuntimeError(f"authorized artifact classes remain: {[a['id'] for a in remaining]}")

          print("AUTHORIZED_CLEANUP_RESULT=" + json.dumps({
              "deleted_count": len(selected),
              "deleted_bytes": total_bytes,
              "main": main["commit"]["sha"],
              "pr45_head": pr["head"]["sha"],
          }, sort_keys=True), flush=True)
          PY
