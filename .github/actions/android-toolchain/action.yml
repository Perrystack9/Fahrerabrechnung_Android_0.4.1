name: Verified Android toolchain
description: Set up the existing JDK, Gradle wrapper and Android SDK with checksum verification.
inputs:
  project-directory:
    description: Checkout directory relative to the workspace.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle 9.6.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "9.6.1"

    - name: Generate and verify official Gradle wrapper
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        project_dir="$PWD"
        bootstrap_dir="$(mktemp -d)"
        printf 'rootProject.name = "wrapper-bootstrap"\n' > "${bootstrap_dir}/settings.gradle.kts"
        (cd "${bootstrap_dir}" && gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin)

        mkdir -p gradle/wrapper
        cp "${bootstrap_dir}/gradlew" gradlew
        cp "${bootstrap_dir}/gradlew.bat" gradlew.bat
        cp "${bootstrap_dir}/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
        cp "${bootstrap_dir}/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
        chmod +x gradlew
        rm -rf "${bootstrap_dir}"

        python3 - <<'PY'
        from pathlib import Path
        path = Path("gradle/wrapper/gradle-wrapper.properties")
        lines = path.read_text(encoding="utf-8").splitlines()
        wanted = "distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14"
        lines = [line for line in lines if not line.startswith("distributionSha256Sum=")]
        insert_at = next((i + 1 for i, line in enumerate(lines) if line.startswith("distributionUrl=")), len(lines))
        lines.insert(insert_at, wanted)
        path.write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY

        echo "${GRADLE_WRAPPER_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
        grep -F "distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" gradle/wrapper/gradle-wrapper.properties
        grep -F "distributionSha256Sum=${GRADLE_DIST_SHA256}" gradle/wrapper/gradle-wrapper.properties
        ./gradlew --version | tee ci-logs/wrapper-version.log
        ./gradlew --version | grep -F "Gradle ${GRADLE_VERSION}"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "15859902"
        log-accepted-android-sdk-licenses: false
        packages: platform-tools

    - name: Install Android SDK Platform 37 and Build Tools 36.0.0
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        sdkmanager --list 2>&1 | tee ci-logs/sdk-packages.log
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager \
          "platform-tools" \
          "platforms;android-${ANDROID_PLATFORM}" \
          "build-tools;${ANDROID_BUILD_TOOLS}" 2>&1 | tee ci-logs/sdk-install.log

    - name: Verify toolchain
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        {
          echo "=== java ==="
          java -version
          echo "=== gradle ==="
          gradle --version
          echo "=== sdkmanager ==="
          sdkmanager --version
          echo "=== installed Android packages ==="
          sdkmanager --list_installed
        } 2>&1 | tee ci-logs/toolchain.log
        java -version 2>&1 | grep -Eq 'version "17\.|openjdk version "17\.'
        gradle --version | grep -F "Gradle ${GRADLE_VERSION}"
        test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_PLATFORM}"
        test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
